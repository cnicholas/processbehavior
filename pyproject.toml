[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "processbehavior"
dynamic = ["version"]
description = "Python-native Process Behavior & Control Charts (spec-driven SPC with tidy outputs)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "cnicholas", email = "4948774+cnicholas@users.noreply.github.com"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
  "spc",
  "quality-control",
  "control-charts",
  "process-behavior",
  "shewhart",
  "variance-analysis",
  "bishop-vas",
  "wheeler",
  "design-of-experiments",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0,<3",
  "natsort>=8.0.0",
  "plotly>=5.18,<7",
]

[project.urls]
Homepage = "https://github.com/cnicholas/processbehavior"
Repository = "https://github.com/cnicholas/processbehavior"
Issues = "https://github.com/cnicholas/processbehavior/issues"
Changelog = "https://github.com/cnicholas/processbehavior/blob/main/CHANGELOG.md"
Documentation = "https://cnicholas.github.io/processbehavior/"

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
images = ["kaleido>=0.2"]
test = [
  # pytest 9.x requires Python 3.10+; keep 3.9 on the latest 8.x line.
  "pytest>=9.0.3; python_version >= '3.10'",
  "pytest>=8.4.2,<9; python_version < '3.10'",
  "pytest-cov>=5",
  "pytest-timeout>=2.4",
  "pyarrow>=14.0",
  "openpyxl>=3.1",
  # nbmake executes notebooks as pytest items; the CI job uses it to
  # catch broken examples in docs/tutorials and docs/getting-started.
  "nbmake>=1.5",
]
lint = [
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  # Transitive CVE-driven floors. filelock>=3.20 and virtualenv>=20.36
  # drop Python 3.9 wheels, so the floors are conditioned on >= 3.10.
  "filelock>=3.20.3; python_version >= '3.10'",
  "virtualenv>=20.36.1; python_version >= '3.10'",
]
docs = [
  "jupyter-book>=2.0",
  "ipykernel",
  # Transitive pins to clear known CVEs in the docs toolchain.
  "lxml>=6.1.0",
  "nbconvert>=7.17.1",
  "pillow>=12.2.0",
  "pygments>=2.20.0",
  "tornado>=6.5.5",
  "orjson>=3.11.6",
  "requests>=2.33.0",
]
dev = [
  "processbehavior[test,lint,images,excel,docs]",
]

[tool.hatch.version]
path = "processbehavior/__init__.py"

[tool.coverage.run]
source = ["processbehavior"]
branch = true

[tool.coverage.report]
# Coverage floor. Currently ~82%; setting to 80 leaves a small safety
# margin while preventing regression. Raise as coverage improves.
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.wheel]
packages = ["processbehavior"]
exclude = [
  "**/*.docx",
  "**/*.html",
  "**/.DS_Store",
  "**/__pycache__/**",
]

[tool.hatch.build.targets.sdist]
include = [
  "processbehavior/**/*.py",
  "processbehavior/py.typed",
  "processbehavior/datasets/data/*.csv",
  "tests/**/*.py",
  "tests/fixtures/**/*",
  "validation/PBTESTDATABASE_T100.csv",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "SECURITY.md",
  "pyproject.toml",
]
exclude = [
  "**/_build/**",
  "**/node_modules/**",
  "**/site/**",
  "**/.DS_Store",
  "**/*.html",
  "**/*.docx",
  "**/.ipynb_checkpoints/**",
  "**/__pycache__/**",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: performance benchmark tests",
    "integration: end-to-end tests through full pipeline",
    "plotting: tests that create plotly figures",
    "io: tests that read/write files (Excel, Parquet, etc.)",
    "golden: golden master snapshot tests",
]

[tool.ruff]
line-length = 120
lint.select = ["E","F","I","UP","B","SIM","C90"]
lint.ignore = []
lint.mccabe.max-complexity = 15
format.quote-style = "single"
target-version = "py39"
extend-exclude = [
  "validation",
  "examples",
  "docs",
  "simulation",
  "*.ipynb",
]

[tool.mypy]
python_version = "3.9"
strict = false
warn_unused_ignores = false
warn_redundant_casts = true
warn_return_any = false
disallow_untyped_defs = false
exclude = ["examples", "docs"]

# Ignore common patterns that are too noisy or require extensive refactoring
[[tool.mypy.overrides]]
module = "processbehavior.*"
ignore_errors = false
disable_error_code = [
    "import-untyped",      # External libs without stubs (plotly, openpyxl)
    "import-not-found",    # Relative import issues
    "method-assign",       # Property/method confusion in analysis_specification
    "truthy-function",     # has_time() checks
    "attr-defined",        # Dynamic attributes
    "assignment",          # Type mismatches requiring refactoring
    "return-value",        # Return type mismatches
    "var-annotated",       # Missing variable type annotations
    "arg-type",            # Argument type mismatches
    "return",              # Missing return statements
    "union-attr",          # None attribute access (needs null checks)
    "index",               # Indexing Optional values
    "call-overload",       # Function overload mismatches
    "list-item",           # Numpy int vs Python int type issues
    "operator",            # Calling functions of unknown type
    "misc",                # Miscellaneous type issues
]

# Note: Can gradually re-enable strict mode per module as types are added
