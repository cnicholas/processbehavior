site_name: ProcessBehavior Documentation
site_description: Statistical Process Control Library for Python
site_author: Nicholas
repo_url: https://github.com/cnicholas/processbehavior
repo_name: cnicholas/processbehavior

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            docstring_style: numpy
            merge_init_into_class: true
            show_signature_annotations: true

nav:
  - Home: intro.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.ipynb
    - Key Concepts: getting-started/key-concepts.md
  - Tutorials:
    - Tutorial Overview: tutorials/index.md
    - Your First Analysis: tutorials/basic-imr.ipynb
    - Signal Detection: tutorials/signal-detection.ipynb
    - Xbar-S Analysis: tutorials/xbar-s-analysis.ipynb
    - Stratified Analysis: tutorials/stratified-analysis.ipynb
    - Process Capability: tutorials/process-capability.ipynb
    - SDS Validation: tutorials/sds-validation.ipynb
    - Complete SDS 1 Analysis: tutorials/sds1-complete-analysis.ipynb
  - User Guide:
    - Formulation: user-guide/formulation.md
    - Chart Types: user-guide/chart-types.md
    - SDS Detection: user-guide/sds-detection.md
    - VAS Residuals: user-guide/residuals.md
    - Excel Export: user-guide/excel-export.md
    - Plotting: user-guide/plotting.md
  - API Reference:
    - API Reference: reference/api.md
    - WECO Rules: reference/weco-rules.md
  - Appendix:
    - Wheeler Terminology: appendix/wheeler-terminology.md
    - Changelog: appendix/changelog.md
