site_name: ProcessBehavior Documentation
site_description: Statistical Process Control Library for Python
site_author: Nicholas
repo_url: https://github.com/cnicholas/processbehavior
repo_name: cnicholas/processbehavior

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            docstring_style: numpy
            merge_init_into_class: true
            show_signature_annotations: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Basic Concepts: getting-started/concepts.md
  - Tutorials:
    - Tutorial Overview: tutorials/index.md
    - Your First Analysis: tutorials/first-analysis.md
    - Understanding SDS: tutorials/understanding-sds.md
    - VAS Residuals: tutorials/vas-residuals.md
    - Stratified Analysis: tutorials/stratified-analysis.md
    - Signal Detection: tutorials/signal-detection.md
  - User Guide:
    - Data Preparation: guide/data-preparation.md
    - Chart Types: guide/chart-types.md
    - Sampling Design States: guide/sampling-design-states.md
    - Residual Analysis: guide/residual-analysis.md
    - Excel Export: guide/excel-export.md
    - Plotting: guide/plotting.md
  - Architecture:
    - Overview: architecture/overview.md
    - Data Flow: architecture/data-flow.md
    - Components: architecture/components.md
  - API Reference:
    - ProcessBehavior: api/process-behavior.md
    - AnalysisResult: api/analysis-result.md
    - Analysis: api/analysis.md
    - SDS Detector: api/sds-detector.md
    - Plotting: api/plotting.md
    - Signals: api/signals.md
  - Development:
    - Contributing: development/contributing.md
    - Testing: development/testing.md
    - Code Style: development/code-style.md
