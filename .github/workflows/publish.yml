name: Publish

on:
  push:
    tags: ["v*"]

# Deliberately tag-only. workflow_dispatch was removed: it can fire from any
# ref, so it could reach the publish job from an arbitrary commit, and with the
# tag/version guard below it has no ref to check against anyway.

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Test gate: before we ship a tag to PyPI, re-run the same matrix that
  # gates main. Catches the case where main regressed between the last
  # CI run and the tag push.
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
        os: [ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Tests
        run: pytest tests/ -m "not slow"

  build:
    name: build & verify distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Verify tag matches package version
        # A tag that disagrees with __version__ publishes a version nobody
        # can reproduce from the repository. Fails before any artifact exists.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          PKG=$(python -c "import processbehavior; print(processbehavior.__version__)")
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG  __version__=$PKG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match __version__ $PKG"
            exit 1
          fi
      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/processbehavior/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
