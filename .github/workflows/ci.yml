name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu + Windows on every commit across the full Python range;
        # macOS billed at 10x so we run it only on the newest Python as
        # a release-readiness check. The maintainer develops on macOS,
        # so regressions also surface in local dev between CI runs.
        python-version: ["3.10", "3.11", "3.13"]
        os: [ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,lint]"
      - name: Lint (ubuntu / 3.11 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: ruff check .
      - name: Typecheck (ubuntu / 3.11 only, advisory)
        # mypy is advisory until the chart-payload TypedDict contract is tightened
        # (GitHub issue #47, "mypy re-enable"). It still runs and surfaces errors in
        # the logs; it does not gate the build. Flip continue-on-error to false once
        # the remaining analysis.py TypedDict mismatches are resolved.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        continue-on-error: true
        run: mypy processbehavior
      - name: Tests
        run: pytest tests/ -m "not slow" --cov=processbehavior --cov-report=xml --cov-report=term-missing
      - name: Execute docs notebooks (ubuntu / 3.13 only)
        # Allowlist of notebooks known to execute against the current API.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          pytest --nbmake \
            docs/getting-started/quickstart.ipynb \
            docs/tutorials/first-xmr-chart.ipynb \
            docs/tutorials/coffee-shop.ipynb \
            docs/tutorials/process-capability.ipynb \
            docs/tutorials/process-capability-before-after.ipynb \
            docs/tutorials/derived-variables.ipynb \
            docs/tutorials/loss-function.ipynb \
            docs/tutorials/xbar-s-analysis.ipynb \
            docs/tutorials/signal-detection.ipynb \
            docs/tutorials/stratified-analysis.ipynb \
            docs/tutorials/design-state-tour.ipynb \
            docs/tutorials/sds-validation.ipynb \
            docs/tutorials/sds1-complete-analysis.ipynb \
            --tb=short
      - name: Validate against Bishop's reference results (ubuntu / 3.13 only)
        # The 280-assertion ground-truth check. It lives outside tests/ because
        # it also renders a report, but nothing was running it — so a drift in
        # the numbers the README advertises would have gone unnoticed.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python validation/e2e_bishop_report.py

      - name: Fail if the validation summary drifted from the committed page
        # The docs page is generated. If a code change moves the numbers, the
        # regenerated page differs and this catches it here rather than in a
        # docs build days later.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: git diff --exit-code -- docs/reference/validation.md

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          # Best-effort: tokenless uploads are rejected without a CODECOV_TOKEN,
          # which should not fail the build. Set true again once a token is
          # configured in repo secrets.
          fail_ci_if_error: false

  audit:
    name: audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install + audit
        run: |
          # setuptools is upgraded explicitly: it is not a declared dependency
          # (this project builds with hatchling), so what gets audited is
          # whatever the runner image ships. That has been failing the job on a
          # setuptools CVE the project has no say in.
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
          pip install pip-audit
          # --strict treats any skipped package as fatal; the project
          # itself is editable here and not yet on PyPI, so it is always
          # skipped. Re-enable --strict once the package is published.
          pip-audit --skip-editable

  package:
    name: build distribution
    runs-on: ubuntu-latest
    outputs:
      sdist: ${{ steps.names.outputs.sdist }}
      wheel: ${{ steps.names.outputs.wheel }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Build & verify
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*
      - id: names
        run: |
          echo "sdist=$(ls dist/*.tar.gz)" >> "$GITHUB_OUTPUT"
          echo "wheel=$(ls dist/*.whl)" >> "$GITHUB_OUTPUT"
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke-test:
    name: install wheel & import public API
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS only on the newest Python (see test job rationale).
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download built distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist
      - name: Install wheel into clean environment
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
      - name: Import public API
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -c "
          import processbehavior as pb
          from processbehavior import (
              ProcessBehavior, ColumnRef, Study, DesignReport, AnalysisResult,
              SpecLimits, CapabilityResult, LossResult, MaximumInformationResult,
              ProcessBehaviorError, ValidationError, ColumnNotFoundError,
              FactorNotFoundError, ChartNotAvailableError, ProcessBehaviorWarning,
              ChartTheme, get_theme, list_themes, register_theme,
              Calibration, Derivation, evaluate, validate,
              make_design,
          )
          assert pb.__version__, 'version not exposed'
          df = make_design(state=1, seed=42)
          study = ProcessBehavior(df).formulate(
              response='y', time='time', factors=['factor 1', 'factor 2'],
          )
          result = study.execute()
          stats = result.get_statistics('Xbar')
          assert {'N', 'center', 'lpl', 'upl'} <= set(stats), stats
          print(f'OK processbehavior {pb.__version__} on import + execute')
          "
