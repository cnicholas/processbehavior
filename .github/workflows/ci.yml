name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint & Typecheck
        run: |
          ruff check .
          mypy processbehavior
      - name: Tests (unittest)
        run: |
          # Adjust -s and -p to your layout if needed
          python -m unittest discover -s tests -p "test_*.py" -v
