name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS dropped from regular CI — 10x billing multiplier and the
        # primary maintainer develops on macOS, so regressions surface
        # locally. Reinstate before tagging the first PyPI release.
        python-version: ["3.9", "3.11", "3.13"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,lint]"
      - name: Lint & typecheck (ubuntu / 3.11 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          ruff check .
          mypy processbehavior
      - name: Tests
        run: pytest tests/ -m "not slow" --cov=processbehavior --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: coverage.xml
          fail_ci_if_error: false

  audit:
    name: audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install + audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit
          # --strict treats any skipped package as fatal; the project
          # itself is editable here and not yet on PyPI, so it is always
          # skipped. Re-enable --strict once the package is published.
          pip-audit --skip-editable

  package:
    name: build distribution
    runs-on: ubuntu-latest
    outputs:
      sdist: ${{ steps.names.outputs.sdist }}
      wheel: ${{ steps.names.outputs.wheel }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build & verify
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*
      - id: names
        run: |
          echo "sdist=$(ls dist/*.tar.gz)" >> "$GITHUB_OUTPUT"
          echo "wheel=$(ls dist/*.whl)" >> "$GITHUB_OUTPUT"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke-test:
    name: install wheel & import public API
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS dropped (see test job for rationale).
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download built distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install wheel into clean environment
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
      - name: Import public API
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -c "
          import processbehavior as pb
          from processbehavior import (
              ProcessBehavior, ColumnRef, Study, DesignReport, AnalysisResult,
              SpecLimits, CapabilityResult, LossResult, MaximumInformationResult,
              ProcessBehaviorError, ValidationError, ColumnNotFoundError,
              FactorNotFoundError, ChartNotAvailableError,
              ChartTheme, get_theme, list_themes, register_theme,
              make_sds,
          )
          assert pb.__version__, 'version not exposed'
          df = make_sds(sds=1, seed=42)
          study = ProcessBehavior(df).formulate(
              response='y', time='time', factors=['factor 1', 'factor 2'],
          )
          result = study.execute()
          stats = result.get_statistics('Xbar')
          assert {'N', 'center', 'lpl', 'upl'} <= set(stats), stats
          print(f'OK processbehavior {pb.__version__} on import + execute')
          "
