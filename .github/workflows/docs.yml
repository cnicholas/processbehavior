name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install package + docs extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,images]"
      - name: Install MyST CLI
        # Pinned: an unpinned global npm install floats to whatever mystmd
        # released today, and its CLI has had breaking changes between minors.
        # Dependabot does not see npm installs inside run steps — bump by hand.
        run: npm install -g mystmd@1.10.1
      - name: Build site
        working-directory: docs
        run: myst build --html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    # Only main deploys. PRs build to catch a broken TOC or a dead file
    # reference before it lands, which a push-only trigger could not do.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Scoped to the deploy job so concurrent PR builds do not queue behind
    # each other on the shared `pages` group.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
