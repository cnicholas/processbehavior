name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - name: Install package + docs extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,images]"
      - name: Install MyST CLI
        # Pinned: an unpinned global npm install floats to whatever mystmd
        # released today, and its CLI has had breaking changes between minors.
        # Dependabot does not see npm installs inside run steps — bump by hand.
        run: npm install -g mystmd@1.10.1
      - name: Build site
        working-directory: docs
        env:
          # The site serves from the /processbehavior/ subpath on Pages;
          # without this, myst emits root-relative asset URLs that 404 there.
          BASE_URL: /processbehavior
        run: myst build --html
      - name: Point sitemap and robots at the public URL
        # mystmd's static export hardcodes localhost:3000 in sitemap.xml and
        # robots.txt (site.domains only applies to its hosted deploys).
        working-directory: docs
        run: |
          sed -i 's|http://localhost:3000|https://cnicholas.github.io/processbehavior|g' \
            _build/html/sitemap.xml _build/html/robots.txt
      - name: Inject Google Search Console verification tag
        # Google checks the property root for this tag; mystmd 1.10.1 has no
        # head-injection hook, so it goes in post-build.
        working-directory: docs
        run: |
          sed -i 's|<head>|<head><meta name="google-site-verification" content="DU_vmXbk9SxCOd3mNHKYljEZZFbVluUofDkZg7cTYzk"/>|' \
            _build/html/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    # Only main deploys. PRs build to catch a broken TOC or a dead file
    # reference before it lands, which a push-only trigger could not do.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Scoped to the deploy job so concurrent PR builds do not queue behind
    # each other on the shared `pages` group.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
