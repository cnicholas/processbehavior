version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    groups:
      runtime:
        dependency-type: production
      dev:
        dependency-type: development
    commit-message:
      prefix: "deps"

  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
