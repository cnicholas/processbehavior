blank_issues_enabled: true
contact_links:
  - name: Security or correctness disclosure
    url: https://github.com/cnicholas/processbehavior/security/policy
    about: >-
      Report privately instead — this includes silent miscalculation an analyst
      would mistake for correct output. See SECURITY.md for scope and SLAs.
  - name: Question about the VAS methodology itself
    url: https://github.com/cnicholas/processbehavior/discussions
    about: >-
      For "what does R4 mean" or "which chart should I use" — as opposed to a
      library defect — start a discussion.
